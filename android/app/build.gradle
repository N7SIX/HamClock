apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'my.hamradio.n7six.hamclock'
    compileSdk 34

    defaultConfig {
        applicationId "my.hamradio.n7six.hamclock"
        // API 19 = Android 4.4 (KitKat). Starting from 4.4, we have better
        // support for native libraries and permissions.
        minSdk 19
        targetSdk 34
        versionCode 762
        versionName "7.6.2"
        // Needed when minSdk < 21 if dex method count ever exceeds 64k.
        multiDexEnabled true
        // Conditional cleartext traffic: debug=true for dev, release=false for Play Store compliance
        manifestPlaceholders = [isDebug: rootProject.hasProperty('DEBUG')]
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug-signed so the APK is immediately installable.
            // Re-sign with your own key before publishing to an app store.
            // v1 (JAR) signature is REQUIRED for Android < 7.0 (API < 24)
            // to install at all. v2 keeps modern install speed/protection.
            // (On AGP 8 these live on the signingConfig, not the buildType.)
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            // Defaults already point at ~/.android/debug.keystore; just ensure
            // both signature schemes are on for 4.2 installability.
            v1SigningEnabled true
            v2SigningEnabled true
        }
        // Release signing config placeholder - add your keystore details here
        // release {
        //     storeFile file('my-release-key.jks')
        //     storePassword 'your_keystore_password'
        //     keyAlias 'my-key-alias'
        //     keyPassword 'your_key_password'
        // }
    }

    compileOptions {
        // Java 8 bytecode runs everywhere from API 19 up. Building with
        // Java 17 bytecode would still install but can hit VerifyError /
        // desugaring gaps on 4.x, so stay on 1.8 for max compatibility.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    // The native HamClock server binary ships as a native library
    // (libhamclock.so per-ABI under src/main/jniLibs, built by
    // packaging/build-apk-native.ps1). Android 10+ forbids execve() of files
    // in the app's data home dir, but the package manager extracts jniLibs to
    // the executable nativeLibraryDir at install time, so we exec it from here.
    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    // Last AndroidX versions that still support minSdk 17 (Android 4.2).
    // Newer appcompat 1.6.x / core 1.12.x require minSdk 19+ and would fail
    // manifest merger with "uses-sdk:minSdkVersion 17 cannot be smaller than 19".
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.core:core:1.6.0'
    // Required when minSdk < 21 once dex crosses 64k methods.
    implementation 'androidx.multidex:multidex:2.0.1'
}

// Name the output APK after the project version
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def version = android.defaultConfig.versionName
        output.outputFileName = "n7six.HamClock.v${version}.apk"
    }
}

// After building, copy the APK into the project dist/ directory
def distDir = new File(rootProject.rootDir.parentFile, "dist")
distDir.mkdirs()

tasks.register("copyDebugApkToDist", Copy) {
    dependsOn assembleDebug
    from(file("$buildDir/outputs/apk/debug/n7six.HamClock.v${android.defaultConfig.versionName}.apk"))
    into(distDir)
    doLast {
        println "APK copied to $distDir/n7six.HamClock.v${android.defaultConfig.versionName}.apk"
    }
}

tasks.register("copyReleaseApkToDist", Copy) {
    dependsOn assembleRelease
    from(file("$buildDir/outputs/apk/release/n7six.HamClock.v${android.defaultConfig.versionName}.apk"))
    into(distDir)
    doLast {
        println "APK copied to $distDir/n7six.HamClock.v${android.defaultConfig.versionName}.apk"
    }
}
